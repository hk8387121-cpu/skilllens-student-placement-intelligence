services:
  - type: web
    name: skilllens-student-placement-intelligence
    runtime: node
    plan: free
    buildCommand: npm install && npx esbuild src/backend/server.ts --bundle --platform=node --format=cjs --packages=external --sourcemap --outfile=dist/server.cjs
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
